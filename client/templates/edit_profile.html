{% extends 'base.html' %}

{% block content %}

<link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
<div class="ep-scope">
    <div class="edit-container" style="margin-top: 30px;">
        <div class="edit-card">
            <h2>Profile Settings</h2>
            <p class="subtitle">Manage your profile data, password and privacy.</p>

            <form method="POST" action="/profile/edit">
                
                <div class="avatar-section">
                    <div class="avatar-wrapper">
                        <img src="https://i.pinimg.com/736x/19/cd/9d/19cd9d5c743ad46b6a7a130029fb4d18.jpg" alt="Avatar">
                    </div>
                    <div class="avatar-info">
                        <div style="margin-bottom: 5px; font-weight: bold;">Profile Picture</div>
                        <div style="margin-bottom: 10px; font-size: 12px; color: #666;">JPG, GIF or PNG. Max 155MB.</div>
                        <button type="button">Upload new picture</button>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" name="username" placeholder="{{ user.username }}">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" placeholder="user@watchly.com">
                    </div>
                </div>

                <div class="form-group">
                    <label>Bio (O mnie)</label>
                    <textarea name="description">{{ user_data.description }}</textarea>
                </div>

                <h3>Security</h3>
                
                <div class="form-group">
                    <label>Current Password</label>
                    <input type="password" name="current_password" placeholder="••••••••">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>New Password</label>
                        <input type="password" name="new_password" placeholder="••••••••">
                    </div>
                    <div class="form-group">
                        <label>Confirm New Password</label>
                        <input type="password" name="confirm_password" placeholder="••••••••">
                    </div>
                </div>

                <h3>Social Media</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Instagram</label>
                        <input type="text" name="instagram" placeholder="@twojanazwa">
                    </div>
                    <div class="form-group">
                        <label>X</label>
                        <input type="text" name="X" placeholder="@twojanazwa">
                    </div>
                </div>

                <h3>Privacy</h3>
                <div class="toggle-wrapper">
                    <div>
                        <div class="toggle-label" style="font-weight: bold;">Private Profile</div>
                        <div style="font-size: 12px; color: #777;">Only people you follow will see your ratings.</div>
                    </div>
                    <label class="switch">
                        <input type="checkbox" name="is_private">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-cancel">Cancel</button>
                    <button type="submit" class="btn-save">Save Changes</button>
                </div>

            </form>
        </div>
    </div>
</div>

{% endblock %}
