{% extends 'base.html' %}

{% block content %}

<link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
<div class="ep-scope">
    <div class="edit-container" style="margin-top: 30px;">
        <div class="edit-card">
            <h2>Ustawienia Profilu</h2>
            <p class="subtitle">Zarządzaj swoimi danymi, hasłem i prywatnością.</p>

            <form method="POST" enctype="multipart/form-data">
                
                <div class="avatar-section">
                    <div class="avatar-wrapper">
                        <img src="https://i.pinimg.com/736x/19/cd/9d/19cd9d5c743ad46b6a7a130029fb4d18.jpg" alt="Avatar">
                    </div>
                    <div class="avatar-info">
                        <div style="margin-bottom: 5px; font-weight: bold;">Zdjęcie profilowe</div>
                        <div style="margin-bottom: 10px; font-size: 12px; color: #666;">JPG, GIF lub PNG. Max 155MB.</div>
                        <button type="button">Wgraj nowe zdjęcie</button>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Nazwa użytkownika</label>
                        <input type="text" name="username">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" placeholder="admin@watchly.com">
                    </div>
                </div>

                <div class="form-group">
                    <label>Bio (O mnie)</label>
                    <textarea name="bio" placeholder="Napisz, jakie gatunki filmowe lubisz najbardziej..."></textarea>
                </div>

                <h3>Bezpieczeństwo</h3>
                
                <div class="form-group">
                    <label>Aktualne hasło</label>
                    <input type="password" name="current_password" placeholder="••••••••">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Nowe hasło</label>
                        <input type="password" name="new_password" placeholder="••••••••">
                    </div>
                    <div class="form-group">
                        <label>Powtórz nowe hasło</label>
                        <input type="password" name="confirm_password" placeholder="••••••••">
                    </div>
                </div>

                <h3>Social Media</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Instagram</label>
                        <input type="text" name="instagram" placeholder="@twojanazwa">
                    </div>
                    <div class="form-group">
                        <label>X</label>
                        <input type="text" name="X" placeholder="@twojanazwa">
                    </div>
                </div>

                <h3>Prywatność</h3>
                <div class="toggle-wrapper">
                    <div>
                        <div class="toggle-label" style="font-weight: bold;">Profil Prywatny</div>
                        <div style="font-size: 12px; color: #777;">Tylko osoby, które obserwujesz, zobaczą Twoje oceny.</div>
                    </div>
                    <label class="switch">
                        <input type="checkbox" name="is_private">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-cancel">Anuluj</button>
                    <button type="submit" class="btn-save">Zapisz zmiany</button>
                </div>

            </form>
        </div>
    </div>
</div>

{% endblock %}
