<!DOCTYPE html>
<html>
<head>
    <title>Home</title>
</head>
<body>
    <nav>
        <a href="/">Home</a> | 
        
        {% if user %}
            <span style="color: green;">Hello, {{ user.username }}!</span>
            <a href="/logout">Logout</a>
        {% else %}
            <a href="/login">Login</a> | 
            <a href="/register">Register</a>
        {% endif %}
    </nav>

    <hr>
    <h1>Welcome to the Watchly</h1>
    <p>This content is visible to everyone.</p>

    {% if user %}
        <p>This content is only for {{ user.username }}.</p>
    {% endif %}

</body>
</html>
